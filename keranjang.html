<section x-show="page === 'cart'" x-cloak class="container mx-auto px-4 py-16 min-h-screen">
  <h2 class="text-3xl font-black mb-12 text-blue-900 text-center uppercase tracking-tighter">Keranjang Belanja</h2>
  <div class="max-w-4xl mx-auto bg-white border-2 border-gray-50 rounded-[50px] p-8 md:p-12 shadow-2xl">
    <template x-for="item in cart">
      <div class="flex flex-col md:flex-row items-center gap-6 border-b border-gray-50 py-8">
        <img :src="item.foto" class="w-24 h-24 rounded-2xl object-cover shadow-md">
        <div class="flex-grow text-center md:text-left">
          <h4 class="font-black text-xl text-gray-800 uppercase" x-text="item.nama"></h4>
          <p class="text-[10px] text-blue-600 font-bold uppercase tracking-widest" x-text="item.jenis + ' | Size: ' + item.size"></p>
        </div>
        <div class="flex items-center gap-10">
          <span class="font-black text-xl text-blue-900" x-text="formatPrice(item.harga)"></span>
          <button @click="cart = cart.filter(i => i.id !== item.id)" class="text-red-400 hover:text-red-600"><i class="fas fa-trash-alt text-xl"></i></button>
        </div>
      </div>
    </template>
    
    <div x-show="cart.length > 0" class="mt-12 space-y-8">
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Metode Pembayaran</label>
          <select x-model="selectedPayment" class="w-full p-4 rounded-2xl bg-gray-50 font-bold border-none outline-none focus:ring-2 focus:ring-blue-900">
            <option value="">-- Pilih Pembayaran --</option>
            <option value="BCA">Transfer BCA</option>
            <option value="DANA">DANA (E-Wallet)</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Ekspedisi Pengiriman</label>
          <select x-model="selectedShipping" class="w-full p-4 rounded-2xl bg-gray-50 font-bold border-none outline-none focus:ring-2 focus:ring-blue-900">
            <option value="">-- Pilih Kurir --</option>
            <option value="JNE">JNE EXPRESS</option>
            <option value="JNT">JNT REGULAR</option>
            <option value="TIKI">TIKI ONS</option>
            <option value="PAXEL">PAXEL</option>
            <option value="GOSEND">GOSEND</option>
          </select>
        </div>
      </div>
      <div class="flex flex-col md:flex-row justify-between items-center pt-10 border-t-4 border-blue-50">
        <h3 class="text-4xl font-black text-blue-900" x-text="formatPrice(getTotal())"></h3>
        <button @click="checkoutWA()" class="bg-green-600 text-white px-12 py-5 rounded-3xl font-black shadow-xl hover:bg-green-700 transition flex items-center gap-4 uppercase text-sm">
          <i class="fab fa-whatsapp text-3xl"></i> Checkout via WhatsApp
        </button>
      </div>
    </div>
  </div>
</section>
